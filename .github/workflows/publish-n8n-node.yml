name: Publish n8n node

on:
  workflow_dispatch:

jobs:
  publish-npm:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      id-token: write

    defaults:
      run:
        working-directory: packages/n8n-node

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Bump patch version
        id: bump-version
        run: |
          npm version patch --no-git-tag-version
          VERSION=$(node -p "require('./package.json').version")
          echo "version=v${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Build and test
        run: npm run prepublishOnly

      - name: Commit version bump
        working-directory: .
        run: |
          git add packages/n8n-node/package.json packages/n8n-node/package-lock.json
          git commit -m "ci: bump n8n-nodes-webz-news-search to ${{ steps.bump-version.outputs.version }}"
          git push

      - name: Publish to npm
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: n8n-node-${{ steps.bump-version.outputs.version }}
          generate_release_notes: true
