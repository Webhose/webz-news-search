[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gpt-researcher-webz"
version = "0.1.0"
description = "GPT Researcher retriever plugin for Webz.io News Search"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Webz.io", email = "support@webz.io" },
]
keywords = ["gpt-researcher", "webz", "news", "search", "retriever"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "webzio-news-search>=0.1.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.entry-points."gpt_researcher.retrievers"]
webz = "gpt_researcher_webz:WebzSearch"

[project.urls]
Homepage = "https://webz.io"
Documentation = "https://docs.webz.io/docs/webz/news-search-api"
Repository = "https://github.com/Webhose/webz-news-search"
Issues = "https://github.com/Webhose/webz-news-search/issues"

[tool.hatch.build.targets.wheel]
packages = ["gpt_researcher_webz"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
