[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lfx-webz"
version = "0.1.0"
description = "Webz.io News Search component for Langflow."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Webz.io", email = "support@webz.io" },
]
keywords = ["langflow", "lfx", "extension", "bundle", "webz", "news", "search"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "lfx>=1.12.0,<2.0.0",
    "httpx>=0.27",
    "langchain-core>=1.2.28,<2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.urls]
Homepage = "https://webz.io"
Documentation = "https://docs.webz.io/docs/webz/news-search-api"
Repository = "https://github.com/Webhose/webz-news-search"

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]
include = ["components*"]

[tool.setuptools.package-data]
"*" = ["extension.json"]

[tool.langflow.extension]
manifest = "extension.json"

[project.entry-points."langflow.extensions"]
lfx_webz = "components.lfx_webz"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
