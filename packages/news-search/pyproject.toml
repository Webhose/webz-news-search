[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "webzio-news-search"
version = "0.1.0"
description = "Python client for the Webz.io News Search API - global news in natural language with semantic ranking and rich filters"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Webz.io", email = "support@webz.io" },
]
keywords = ["webz", "news", "search", "api", "llm", "tool", "agent"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[project.urls]
Homepage = "https://webz.io"
Documentation = "https://docs.webz.io/docs/webz/news-search-api"
Repository = "https://github.com/Webhose/webz-news-search"
Issues = "https://github.com/Webhose/webz-news-search/issues"

[tool.hatch.build.targets.wheel]
packages = ["webzio_news_search"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
