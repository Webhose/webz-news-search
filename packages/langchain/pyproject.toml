[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "langchain-webz"
version = "0.1.1"
description = "Python tools for Webz.io News Search - global news in natural language with semantic ranking and rich filters"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Webz.io", email = "support@webz.io" },
]
keywords = ["langchain", "langgraph", "webz", "news", "mcp", "search"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "langchain-core>=0.3.0",
    "langchain-mcp-adapters>=0.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[project.urls]
Homepage = "https://news-search-mcp.webz.io"
Documentation = "https://docs.webz.io/docs/webz/news-search-api-mcp"
Repository = "https://github.com/Webhose/webz-news-search"
Issues = "https://github.com/Webhose/webz-news-search/issues"

[tool.hatch.build.targets.wheel]
packages = ["langchain_webz"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
