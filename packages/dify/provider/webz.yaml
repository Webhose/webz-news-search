identity:
  author: ori-webz
  name: webz
  label:
    en_US: Webz News Search
    zh_Hans: Webz News Search
    pt_BR: Webz News Search
  description:
    en_US: Search global news in natural language with semantic ranking and filters for date, country, language, category, and sentiment.
    zh_Hans: Search global news in natural language with semantic ranking and filters for date, country, language, category, and sentiment.
    pt_BR: Search global news in natural language with semantic ranking and filters for date, country, language, category, and sentiment.
  icon: icon.png
