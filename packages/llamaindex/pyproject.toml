[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "llama-index-tools-webz"
version = "0.1.0"
description = "Python tools for Webz.io News Search - global news in natural language with semantic ranking and rich filters"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Webz.io", email = "support@webz.io" },
]
keywords = ["llamaindex", "llama-index", "webz", "news", "mcp", "search"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "llama-index-core>=0.13.0,<0.15",
    "llama-index-tools-mcp>=0.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]
examples = [
    "llama-index-llms-openai-like>=0.4.0",
]

[project.urls]
Homepage = "https://news-search-mcp.webz.io"
Documentation = "https://docs.webz.io/docs/webz/news-search-api-mcp"
Repository = "https://github.com/Webhose/webz-news-search"
Issues = "https://github.com/Webhose/webz-news-search/issues"

[tool.hatch.build.targets.sdist]
include = ["llama_index/", "LICENSE", "README.md"]

[tool.hatch.build.targets.wheel]
include = ["llama_index/"]

[tool.llamahub]
contains_example = true
import_path = "llama_index.tools.webz"

[tool.llamahub.class_authors]
WebzNewsSearch = "Webz.io"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
